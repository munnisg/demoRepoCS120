<html>
<head>
    <style>
        h1{
            color:mediumpurple;
            text-shadow: 4px 4px 4px indigo;
            text-align: center;
        }
        input {            
            height:4vh;
            font-size:2vh;
        }
    </style>
    <link rel="stylesheet" href="FixedItems.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
</head>
<body>
    <div class="sidenav">
        <a id="Home" href="HomePage">
            <img src="images/Logo.jpg" style="max-width:80%;align-self: center;width:auto">
        </a>
        <div>
            <a href="TrackList">Tracks</a>
        </div>
        <div>
            <a href="Events">Events</a>
        </div>
        <div style="background:rgba(255,255,255,0.25)">
            <a href="ContactPage">Contact</a>
        </div>  
    </div>
    <div class="main">
        <div class="banner-image"></div>
        <h1 style="font-size:4vw">Let us rock your next event!</h1>
        <p style="color:lightgray;font-size:1.5vw;text-align: center;">
            Use the form below, or contact us directly.            
        </p>
        <p style="color:lightgray;font-size:1vw;text-align: center;">
            <i class="fa fa-envelope-square" style="color:mediumpurple"></i> hematiteband@gmail.com <br/> <br/>
            <i class="fa fa-phone-square" style="color:mediumpurple"></i> (978) 432-1357
        </p>
        <form style="text-align:center;padding-top:2vh">
            <div style="padding:1vh">
                <label style="color:lightgray;font-size:1vw;font-weight:bold" for="eventDate">Date of your Event:</label>
                <input id="eventDate" style="font-size:2vh" id="Date" type="date">                
            </div>
            <div style="padding:1vh">
                <label style="color:lightgray;font-size:1vw;font-weight:bold" for="Name">Your Name:</label>
                <input style="height:4vh;font-size:2vh;width:40%" id="Name" type="text" placeholder="Name">
            </div>
            <div style="padding:1vh;padding-bottom:10vh">
                <label style="color:lightgray;font-size:1vw;font-weight:bold;top:20%" for="Message">Message:</label>
                <input id="Message" style="width:45%;height:20vh;" type="textbox" placeholder="Tell us about your event! How can we help you rock out?">
            </div>
        </form>
    </div>
</body>
</html>
