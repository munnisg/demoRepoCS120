<html>
<body>
    <div id="answer"></div>
    <script>
        function count(a,b) {
            let r = 0
            for (i = 0; i < a.length; i++) {
                if (a[i] < b) {
                    r++
                }
            }
            return r;
        }

        function testCount() {
            let a = [3,55,30,28,9,12,5]
            let r = count(a,10)
            document.getElementById("answer").textContent = r           
        }
        testCount()
    </script>
</body>
</html>
