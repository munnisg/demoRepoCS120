<html>
<head>
    <meta charset="utf-8">
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
    <title>json3</title>
</head>
<body>
    <form>
        <select id="genreSelect"></select>
        <button id="genreFilter">Filter</button>
    </form>
    <div>
        <ul id="songList">

        </ul>
    </div>
    
    <script>
        const genreList = []
        const songs = []
        $.getJSON("https://munnisg.github.io/demoRepoCS120/songs.json",function(data) {
            data.forEach(s => {
                songs.push(s)
                s.genre.forEach(g => {
                    if (genreList.indexOf(g) < 0) {
                        genreList.push(g)
                        $("#genreSelect").append('<option>' + g + '</option>')
                    }
                })
            })
            $("option:first").prop('selected',true)        
        })

        $(document).ready(function() {
            $("#genreFilter").click(
            function(e) {
                e.preventDefault()
                $("#songList").empty()
                songs.forEach(s => {
                    if (s.genre.indexOf($("#genreSelect").val()) >= 0) {
                        $("#songList").append('<li>' + s.title + '</li>')
                    }
                })
            }
        )
        })        
    </script>
</body>
</html>
