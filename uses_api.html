<html>
<head>
    <meta charset="utf-8">
    <script
        src="https://code.jquery.com/jquery-3.7.1.min.js"
        integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo="
        crossorigin="anonymous"></script>
    <title>Boston Weather</title>
</head>
<body>
    <div id="output"></div>
    <script>
        async function getData() {
            const url = "https://api.weatherstack.com/current?access_key=c5cf70fc74fc5a09ce658bf0904f2eab&query=Boston&units=f"
            const options = {
                method:"GET",
            }

            try {
                const response = await fetch(url,options)
                // console.log("hello?")
                const result = await response.text()
                let weatherData = JSON.parse(result)
                $("#output").append("<h1>" + weatherData.location.name + ", " + weatherData.location.region + "</h1>")
                $("#output").append("<p style='font-size:large'><strong>Current Temperature:</strong> " + weatherData.current.temperature+ "&deg;F</p>")
                $("#output").append("<p style='font-size:large'><strong>Wind:</strong> " + weatherData.current.wind_speed + " mph " + weatherData.current.wind_dir + "</p>")
                $("#output").append("<p style='font-size:large'><strong>Humidity:</strong> " + weatherData.current.humidity + "%</p>")
            } catch (error) {
                console.log(error)
            }           
        }         
        getData()
    </script>
</body>
</html>
